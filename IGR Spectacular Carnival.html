<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>IGR Spectacular Culture Carnival</title>
    
    <!-- Meta tags for PWA / Mobile App behavior -->
    <meta name="theme-color" content="#4B0082">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎪</text></svg>">
    
    <!-- Tailwind CSS for styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&family=Bebas+Neue&display=swap" rel="stylesheet">
    
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        :root {
            --carnival-gold: #FFD700;
            --carnival-purple: #4B0082;
            --carnival-pink: #FF1493;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background-color: #f3f4f6;
            -webkit-tap-highlight-color: transparent;
        }

        .font-carnival {
            font-family: 'Bebas Neue', cursive;
            letter-spacing: 2px;
        }

        /* Gradient Backgrounds */
        .bg-carnival-gradient {
            background: linear-gradient(135deg, var(--carnival-purple) 0%, var(--carnival-pink) 100%);
        }

        .text-gradient {
            background: linear-gradient(to right, #FFD700, #FFA500);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* Card Styles */
        .participant-card {
            transition: transform 0.2s, box-shadow 0.2s;
            background: white;
            border-left: 6px solid var(--carnival-pink);
        }
        
        .participant-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
        }

        /* Number Input Styling - Remove arrows */
        input[type=number]::-webkit-inner-spin-button, 
        input[type=number]::-webkit-outer-spin-button { 
            -webkit-appearance: none; 
            margin: 0; 
        }
        input[type=number] {
            -moz-appearance: textfield;
        }

        /* Animations */
        @keyframes shuffle-shake {
            0% { transform: translate(1px, 1px) rotate(0deg); }
            10% { transform: translate(-1px, -2px) rotate(-1deg); }
            20% { transform: translate(-3px, 0px) rotate(1deg); }
            30% { transform: translate(3px, 2px) rotate(0deg); }
            40% { transform: translate(1px, -1px) rotate(1deg); }
            50% { transform: translate(-1px, 2px) rotate(-1deg); }
            60% { transform: translate(-3px, 1px) rotate(0deg); }
            70% { transform: translate(3px, 1px) rotate(-1deg); }
            80% { transform: translate(-1px, -1px) rotate(1deg); }
            90% { transform: translate(1px, 2px) rotate(0deg); }
            100% { transform: translate(1px, -2px) rotate(-1deg); }
        }

        .animating-shuffle {
            animation: shuffle-shake 0.3s infinite;
            filter: blur(1px);
        }

        .number-slot {
            transition: all 0.1s;
        }

        /* Toast Animation */
        .toast-enter {
            transform: translateY(-100%);
            opacity: 0;
        }
        .toast-enter-active {
            transform: translateY(0);
            opacity: 1;
            transition: all 0.3s ease-out;
        }
        .toast-exit {
            transform: translateY(0);
            opacity: 1;
        }
        .toast-exit-active {
            transform: translateY(-100%);
            opacity: 0;
            transition: all 0.3s ease-in;
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #f1f1f1; 
        }
        ::-webkit-scrollbar-thumb {
            background: #d1d5db; 
            border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #9ca3af; 
        }
    </style>
</head>
<body class="bg-gray-100 text-gray-800 min-h-screen flex flex-col">

    <div id="toast-container" class="fixed top-4 left-0 right-0 z-50 flex flex-col items-center gap-2 pointer-events-none"></div>

    <!-- Add Participant Modal -->
    <div id="add-modal" class="fixed inset-0 bg-black bg-opacity-50 z-40 hidden flex items-center justify-center p-4 backdrop-blur-sm transition-opacity">
        <div class="bg-white rounded-2xl w-full max-w-md overflow-hidden shadow-2xl transform transition-transform scale-95 opacity-0" id="add-modal-content">
            <div class="bg-carnival-gradient p-4 text-white">
                <h2 class="text-xl font-bold flex items-center gap-2">
                    <i data-lucide="user-plus"></i> Tambah Peserta
                </h2>
            </div>
            <form id="add-form" class="p-6">
                <div class="mb-4">
                    <label class="block text-sm font-semibold text-gray-700 mb-1">Nama Peserta / Grup <span class="text-red-500">*</span></label>
                    <input type="text" id="input-name" required class="w-full px-4 py-2 rounded-lg border border-gray-300 focus:ring-2 focus:ring-pink-500 focus:border-pink-500 outline-none transition-all" placeholder="Masukkan nama..." autocomplete="off">
                </div>
                <div class="mb-6">
                    <label class="block text-sm font-semibold text-gray-700 mb-1">Keterangan (Opsional)</label>
                    <input type="text" id="input-notes" class="w-full px-4 py-2 rounded-lg border border-gray-300 focus:ring-2 focus:ring-pink-500 focus:border-pink-500 outline-none transition-all" placeholder="Asal daerah, tema, dll..." autocomplete="off">
                </div>
                <div class="flex justify-end gap-3">
                    <button type="button" onclick="closeAddModal()" class="px-5 py-2 text-gray-600 font-semibold bg-gray-100 hover:bg-gray-200 rounded-lg transition-colors">Batal</button>
                    <button type="submit" class="px-5 py-2 text-white font-semibold bg-carnival-gradient rounded-lg shadow-md hover:opacity-90 transition-opacity">Simpan</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Confirm Modal -->
    <div id="confirm-modal" class="fixed inset-0 bg-black bg-opacity-50 z-40 hidden flex items-center justify-center p-4 backdrop-blur-sm transition-opacity">
        <div class="bg-white rounded-2xl w-full max-w-sm p-6 shadow-2xl text-center transform transition-transform scale-95 opacity-0" id="confirm-modal-content">
            <div class="w-16 h-16 bg-red-100 text-red-500 rounded-full flex items-center justify-center mx-auto mb-4">
                <i data-lucide="alert-triangle" class="w-8 h-8"></i>
            </div>
            <h3 class="text-lg font-bold text-gray-800 mb-2" id="confirm-title">Konfirmasi</h3>
            <p class="text-gray-600 text-sm mb-6" id="confirm-message">Apakah Anda yakin?</p>
            <div class="flex justify-center gap-3">
                <button type="button" onclick="closeConfirmModal()" class="px-5 py-2 text-gray-600 font-semibold bg-gray-100 hover:bg-gray-200 rounded-lg transition-colors w-1/2">Batal</button>
                <button type="button" id="confirm-btn" class="px-5 py-2 text-white font-semibold bg-red-500 hover:bg-red-600 rounded-lg shadow-md transition-colors w-1/2">Ya, Hapus</button>
            </div>
        </div>
    </div>

    <!-- Header -->
    <header class="bg-carnival-gradient text-white pt-8 pb-12 px-4 shadow-lg rounded-b-[2.5rem] relative overflow-hidden shrink-0">
        <!-- Decorative elements -->
        <div class="absolute top-0 left-0 w-full h-full opacity-10 pointer-events-none" style="background-image: radial-gradient(circle, #fff 2px, transparent 2px); background-size: 20px 20px;"></div>
        
        <div class="max-w-4xl mx-auto text-center relative z-10">
            <p class="text-pink-200 font-semibold tracking-widest text-sm mb-1 uppercase">Sistem Pengundian Urutan</p>
            <h1 class="font-carnival text-5xl md:text-6xl text-gradient drop-shadow-md leading-none mb-4">
                IGR SPECTACULAR<br>CULTURE CARNIVAL
            </h1>
            
            <div class="inline-flex items-center gap-2 bg-white/20 backdrop-blur-md px-6 py-2 rounded-full border border-white/30 shadow-sm mt-2">
                <i data-lucide="users" class="w-5 h-5 text-yellow-300"></i>
                <span class="font-semibold text-lg">Total Peserta: <span id="stats-total" class="font-bold text-yellow-300">0</span></span>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="flex-1 w-full max-w-4xl mx-auto px-4 -mt-6 relative z-20 pb-20">
        
        <!-- Action Dashboard -->
        <div class="bg-white rounded-2xl shadow-xl p-4 md:p-6 mb-6">
            <div class="grid grid-cols-2 md:grid-cols-4 gap-3">
                <button onclick="openAddModal()" class="col-span-2 md:col-span-1 flex flex-col items-center justify-center p-3 bg-blue-50 text-blue-700 rounded-xl hover:bg-blue-100 transition-colors border border-blue-100">
                    <i data-lucide="plus-circle" class="w-6 h-6 mb-1"></i>
                    <span class="font-semibold text-sm">Tambah Peserta</span>
                </button>
                
                <button onclick="randomizeNumbers()" class="col-span-2 md:col-span-1 flex flex-col items-center justify-center p-3 bg-pink-50 text-pink-700 rounded-xl hover:bg-pink-100 transition-colors border border-pink-100 group">
                    <i data-lucide="shuffle" class="w-6 h-6 mb-1 group-hover:rotate-180 transition-transform duration-500"></i>
                    <span class="font-semibold text-sm">Acak Nomor</span>
                </button>

                <button onclick="sortList()" class="col-span-2 md:col-span-1 flex flex-col items-center justify-center p-3 bg-purple-50 text-purple-700 rounded-xl hover:bg-purple-100 transition-colors border border-purple-100">
                    <i data-lucide="arrow-down-0-1" class="w-6 h-6 mb-1"></i>
                    <span class="font-semibold text-sm">Urutkan Nomor</span>
                </button>

                <button onclick="confirmReset()" class="col-span-2 md:col-span-1 flex flex-col items-center justify-center p-3 bg-red-50 text-red-700 rounded-xl hover:bg-red-100 transition-colors border border-red-100">
                    <i data-lucide="trash-2" class="w-6 h-6 mb-1"></i>
                    <span class="font-semibold text-sm">Reset Data</span>
                </button>
            </div>
        </div>

        <!-- Participant List Container -->
        <div id="list-container" class="space-y-4">
            <!-- Empty State -->
            <div id="empty-state" class="hidden flex flex-col items-center justify-center py-12 px-4 text-center bg-white rounded-2xl shadow-sm border border-gray-100">
                <div class="w-20 h-20 bg-gray-50 rounded-full flex items-center justify-center mb-4">
                    <i data-lucide="users" class="w-10 h-10 text-gray-300"></i>
                </div>
                <h3 class="text-xl font-bold text-gray-700 mb-2">Belum Ada Peserta</h3>
                <p class="text-gray-500 text-sm max-w-xs">Tambahkan peserta baru untuk memulai pengundian nomor urut karnaval.</p>
                <button onclick="openAddModal()" class="mt-6 px-6 py-2 bg-carnival-gradient text-white rounded-full font-semibold shadow-md hover:opacity-90 transition-opacity">
                    Tambah Peserta Pertama
                </button>
            </div>

            <!-- List -->
            <div id="participant-list" class="space-y-3">
                <!-- Cards will be injected here by JS -->
            </div>
        </div>
    </main>

    <script>
        // Initialize Icons
        lucide.createIcons();

        // --- STATE MANAGEMENT ---
        const STORAGE_KEY = 'igr_carnival_participants';
        let participants = [];
        let isAnimating = false;

        // Load data from LocalStorage
        function loadData() {
            const data = localStorage.getItem(STORAGE_KEY);
            if (data) {
                try {
                    participants = JSON.parse(data);
                } catch (e) {
                    participants = [];
                }
            } else {
                participants = [];
            }
        }

        // Save data to LocalStorage
        function saveData() {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(participants));
        }

        // Helper: Zero pad numbers (e.g., 1 -> "01")
        function pad(num) {
            return num.toString().padStart(2, '0');
        }

        // Generate unique ID
        function generateId() {
            return 'id-' + Date.now() + '-' + Math.floor(Math.random() * 1000);
        }

        // --- DOM ELEMENTS ---
        const listContainer = document.getElementById('participant-list');
        const emptyState = document.getElementById('empty-state');
        const statsTotal = document.getElementById('stats-total');
        
        const addModal = document.getElementById('add-modal');
        const addModalContent = document.getElementById('add-modal-content');
        const addForm = document.getElementById('add-form');
        const inputName = document.getElementById('input-name');
        const inputNotes = document.getElementById('input-notes');

        const confirmModal = document.getElementById('confirm-modal');
        const confirmModalContent = document.getElementById('confirm-modal-content');
        const confirmTitle = document.getElementById('confirm-title');
        const confirmMessage = document.getElementById('confirm-message');
        const confirmBtn = document.getElementById('confirm-btn');

        // --- UI & RENDERING ---

        // Show Toast Notification
        function showToast(message, type = 'error') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            
            let bgClass = type === 'error' ? 'bg-red-500' : (type === 'success' ? 'bg-green-500' : 'bg-blue-500');
            let icon = type === 'error' ? 'alert-circle' : 'check-circle';
            
            toast.className = `${bgClass} text-white px-4 py-3 rounded-lg shadow-lg flex items-center gap-3 toast-enter pointer-events-auto max-w-sm w-full mx-4`;
            toast.innerHTML = `
                <i data-lucide="${icon}" class="w-5 h-5 shrink-0"></i>
                <span class="font-medium text-sm">${message}</span>
            `;
            
            container.appendChild(toast);
            lucide.createIcons();

            // Trigger enter animation
            requestAnimationFrame(() => {
                toast.classList.remove('toast-enter');
                toast.classList.add('toast-enter-active');
            });

            // Remove after 3 seconds
            setTimeout(() => {
                toast.classList.remove('toast-enter-active');
                toast.classList.add('toast-exit-active');
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        }

        // Render Participant List
        function renderList() {
            statsTotal.textContent = participants.length;

            if (participants.length === 0) {
                emptyState.classList.remove('hidden');
                listContainer.innerHTML = '';
                return;
            }

            emptyState.classList.add('hidden');
            listContainer.innerHTML = '';

            participants.forEach(p => {
                const card = document.createElement('div');
                card.className = 'participant-card rounded-xl p-4 flex items-center justify-between gap-4 overflow-hidden relative group';
                card.id = `card-${p.id}`;
                
                // Card Inner HTML
                card.innerHTML = `
                    <div class="flex items-center gap-4 flex-1 min-w-0">
                        <!-- Number Box -->
                        <div class="flex flex-col items-center justify-center w-16 h-16 shrink-0 bg-yellow-50 rounded-lg border border-yellow-200">
                            <span class="text-[10px] font-bold text-yellow-600 mb-[-4px]">NO.</span>
                            <input type="number" 
                                value="${p.seq}" 
                                class="w-full text-center font-carnival text-3xl text-carnival-purple bg-transparent outline-none number-slot"
                                onchange="handleManualEdit('${p.id}', this)"
                                onfocus="this.select()"
                                ${isAnimating ? 'disabled' : ''}
                            />
                        </div>
                        
                        <!-- Info Box -->
                        <div class="flex-1 min-w-0 flex flex-col justify-center">
                            <input type="text" 
                                value="${p.name}" 
                                class="font-bold text-gray-800 text-lg w-full bg-transparent outline-none border-b border-transparent focus:border-pink-300 transition-colors truncate"
                                onchange="updateData('${p.id}', 'name', this.value)"
                                placeholder="Nama Peserta"
                                ${isAnimating ? 'disabled' : ''}
                            />
                            <input type="text" 
                                value="${p.notes}" 
                                class="text-sm text-gray-500 w-full bg-transparent outline-none border-b border-transparent focus:border-pink-300 transition-colors truncate mt-1"
                                onchange="updateData('${p.id}', 'notes', this.value)"
                                placeholder="Tambahkan keterangan..."
                                ${isAnimating ? 'disabled' : ''}
                            />
                        </div>
                    </div>

                    <!-- Delete Button -->
                    <button onclick="confirmDelete('${p.id}', '${p.name}')" 
                        class="shrink-0 p-2 text-gray-400 hover:text-red-500 hover:bg-red-50 rounded-lg transition-colors focus:outline-none"
                        ${isAnimating ? 'disabled' : ''}>
                        <i data-lucide="trash-2" class="w-5 h-5"></i>
                    </button>
                `;
                listContainer.appendChild(card);
            });
            
            // Re-initialize icons for newly injected elements
            lucide.createIcons();
        }

        // --- STREAMING_CHUNK:Core Logic & Operations ---

        // Add Participant
        addForm.addEventListener('submit', (e) => {
            e.preventDefault();
            const name = inputName.value.trim();
            const notes = inputNotes.value.trim();

            if (!name) return;

            // Auto sequence (next available highest number + 1, or 1)
            let nextSeq = 1;
            if (participants.length > 0) {
                const maxSeq = Math.max(...participants.map(p => p.seq));
                nextSeq = maxSeq + 1;
            }

            const newParticipant = {
                id: generateId(),
                seq: nextSeq,
                name: name,
                notes: notes
            };

            participants.push(newParticipant);
            saveData();
            renderList();
            closeAddModal();
            showToast('Peserta berhasil ditambahkan!', 'success');
        });

        // Update Text Data (Name/Notes)
        function updateData(id, field, value) {
            const p = participants.find(p => p.id === id);
            if (p) {
                p[field] = value.trim();
                saveData();
            }
        }

        // Handle Manual Edit of Sequence Number
        function handleManualEdit(id, inputElement) {
            let newSeq = parseInt(inputElement.value);
            const p = participants.find(p => p.id === id);
            
            // Revert if invalid
            if (isNaN(newSeq) || newSeq <= 0) {
                inputElement.value = p.seq; // revert visually
                showToast("Nomor urut tidak valid!");
                return;
            }

            // Check for duplicates
            const isDuplicate = participants.some(participant => participant.seq === newSeq && participant.id !== id);
            
            if (isDuplicate) {
                inputElement.value = p.seq; // revert visually
                showToast(`Gagal: Nomor ${newSeq} sudah digunakan peserta lain!`, 'error');
                return;
            }

            // Apply change
            p.seq = newSeq;
            saveData();
            showToast(`Nomor ${p.name} diperbarui menjadi ${newSeq}`, 'success');
            // Re-render to ensure sorting or UI state remains consistent if needed, 
            // but for smooth UX, leaving it as is until "Urutkan" is pressed is better.
        }

        // Sort List by Sequence Number
        function sortList() {
            if (participants.length === 0) return;
            participants.sort((a, b) => a.seq - b.seq);
            saveData();
            renderList();
            showToast('Daftar diurutkan berdasarkan nomor.', 'success');
        }

        // Randomize Logic (Fisher-Yates Shuffle with Animation)
        function randomizeNumbers() {
            if (participants.length < 2) {
                showToast("Minimal butuh 2 peserta untuk diacak!", "error");
                return;
            }

            if(isAnimating) return; // Prevent double click

            isAnimating = true;
            listContainer.classList.add('animating-shuffle');
            
            // Disable all inputs & buttons during animation visually by re-rendering with disabled state
            renderList();

            // Prepare exactly numbers from 1 to N
            const total = participants.length;
            let sequences = Array.from({length: total}, (_, i) => i + 1);

            // Shuffle sequences
            for (let i = sequences.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [sequences[i], sequences[j]] = [sequences[j], sequences[i]];
            }

            // Animation effect: rapidly change numbers randomly for 1.5 seconds
            const inputs = document.querySelectorAll('.number-slot');
            const slotInterval = setInterval(() => {
                inputs.forEach(input => {
                    input.value = Math.floor(Math.random() * total) + 1;
                });
            }, 100); // Change every 100ms

            // Stop animation and apply real result after 1.5s
            setTimeout(() => {
                clearInterval(slotInterval);
                
                // Assign new sequences to state
                participants.forEach((p, idx) => {
                    p.seq = sequences[idx];
                });

                // Auto sort after randomize
                participants.sort((a, b) => a.seq - b.seq);
                
                saveData();
                
                // Cleanup animation classes
                listContainer.classList.remove('animating-shuffle');
                isAnimating = false;
                
                renderList(); // Render final sorted result
                
                showToast('Pengacakan Selesai!', 'success');
                
                // Trigger confetti or final pop effect on the container
                listContainer.classList.add('scale-95');
                setTimeout(() => listContainer.classList.remove('scale-95'), 150);

            }, 1500);
        }

        // --- STREAMING_CHUNK:Modal Handlers ---

        let actionToConfirm = null; // Stores function to execute on confirm

        function openAddModal() {
            addForm.reset();
            addModal.classList.remove('hidden');
            setTimeout(() => {
                addModalContent.classList.remove('scale-95', 'opacity-0');
                inputName.focus();
            }, 10);
        }

        function closeAddModal() {
            addModalContent.classList.add('scale-95', 'opacity-0');
            setTimeout(() => {
                addModal.classList.add('hidden');
            }, 200);
        }

        function openConfirmModal(title, message, callback) {
            confirmTitle.textContent = title;
            confirmMessage.textContent = message;
            actionToConfirm = callback;
            
            confirmModal.classList.remove('hidden');
            setTimeout(() => {
                confirmModalContent.classList.remove('scale-95', 'opacity-0');
            }, 10);
        }

        function closeConfirmModal() {
            confirmModalContent.classList.add('scale-95', 'opacity-0');
            setTimeout(() => {
                confirmModal.classList.add('hidden');
                actionToConfirm = null;
            }, 200);
        }

        // Execute Confirmation
        confirmBtn.addEventListener('click', () => {
            if (actionToConfirm) {
                actionToConfirm();
            }
            closeConfirmModal();
        });

        // Trigger Confirm Delete single item
        function confirmDelete(id, name) {
            openConfirmModal(
                'Hapus Peserta',
                `Yakin ingin menghapus "${name}" dari daftar?`,
                () => {
                    participants = participants.filter(p => p.id !== id);
                    saveData();
                    renderList();
                    showToast('Peserta dihapus.', 'success');
                }
            );
        }

        // Trigger Confirm Reset All
        function confirmReset() {
            if(participants.length === 0) return;
            openConfirmModal(
                'Reset Semua Data',
                'PERINGATAN: Seluruh data peserta akan dihapus secara permanen. Lanjutkan?',
                () => {
                    participants = [];
                    saveData();
                    renderList();
                    showToast('Seluruh data berhasil direset.', 'success');
                }
            );
        }

        // --- INITIALIZATION ---
        document.addEventListener('DOMContentLoaded', () => {
            loadData();
            // Optional: Initial Sort on load to ensure neatness
            participants.sort((a, b) => a.seq - b.seq);
            renderList();
        });

    </script>
</body>
</html>
